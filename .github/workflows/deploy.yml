name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /home/deploy/worker
            git pull origin main
            venv/bin/pip install -r requirements.txt
            sudo cp /home/deploy/worker/deploy/mega-fun-worker.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable mega-fun-worker
            sudo systemctl restart mega-fun-worker
